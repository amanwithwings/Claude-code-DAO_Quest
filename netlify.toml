[build]
  command = "npm run build"
  publish = "dist"

[functions]
  # esbuild bundler lets functions import from project node_modules (incl. viem)
  node_bundler = "esbuild"

# Route /api/* to the matching serverless function
[[redirects]]
  from   = "/api/tally"
  to     = "/.netlify/functions/tally"
  status = 200

[[redirects]]
  from   = "/api/save-progress"
  to     = "/.netlify/functions/save-progress"
  status = 200

[[redirects]]
  from   = "/api/set-display-name"
  to     = "/.netlify/functions/set-display-name"
  status = 200

# SPA fallback — must come last
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
